<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free percentage calculator. Calculate what a percentage of a number is.">
  <title>Percentage Calculator | Free Calculators</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container calculator-page">
    <a class="back" href="../index.html">← All calculators</a>
    <section class="calculator">
      <h1>Percentage Calculator</h1>
      <p class="intro">Calculate what a percentage of a number is.</p>
      <div class="field">
        <label for="percent">Percentage</label>
        <input id="percent" type="number" step="any" placeholder="e.g. 20">
      </div>
      <div class="field">
        <label for="number">Number</label>
        <input id="number" type="number" step="any" placeholder="e.g. 150">
      </div>
      <button onclick="calculate()">Calculate</button>
      <div class="result" id="result"></div>
      <div class="explanation">
        <h2>How it works</h2>
        <p>This calculator finds the value of a percentage of a number. For example, 20% of 150 is 30.</p>
      </div>
    </section>
  </main>
  <script>
    function calculate() {
      const p = parseFloat(document.getElementById('percent').value);
      const n = parseFloat(document.getElementById('number').value);
      const result = document.getElementById('result');
      if (isNaN(p) || isNaN(n)) {
        result.textContent = 'Please enter both numbers.';
        return;
      }
      result.textContent = `${p}% of ${n} = ${format(p * n / 100)}`;
    }
    function format(n) {
      return Number.isInteger(n) ? n : Number(n.toFixed(8));
    }
  </script>
</body>
</html>
