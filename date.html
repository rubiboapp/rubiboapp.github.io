<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free date calculator. Calculate the number of days between two dates.">
  <title>Date Calculator | Free Calculators</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container calculator-page">
    <a class="back" href="../index.html">← All calculators</a>
    <section class="calculator">
      <h1>Date Calculator</h1>
      <p class="intro">Calculate the number of days between two dates.</p>
      <div class="field">
        <label for="start">Start date</label>
        <input id="start" type="date">
      </div>
      <div class="field">
        <label for="end">End date</label>
        <input id="end" type="date">
      </div>
      <button onclick="calculate()">Calculate</button>
      <div class="result" id="result"></div>
      <div class="explanation">
        <h2>How it works</h2>
        <p>Select two dates to find the number of days between them.</p>
      </div>
    </section>
  </main>
  <script>
    function calculate() {
      const startValue = document.getElementById('start').value;
      const endValue = document.getElementById('end').value;
      const result = document.getElementById('result');

      if (!startValue || !endValue) {
        result.textContent = 'Please select both dates.';
        return;
      }

      const start = new Date(startValue + 'T00:00:00');
      const end = new Date(endValue + 'T00:00:00');
      const days = Math.round(Math.abs(end - start) / 86400000);

      result.textContent = `${days} day${days === 1 ? '' : 's'} between the selected dates.`;
    }
  </script>
</body>
</html>
