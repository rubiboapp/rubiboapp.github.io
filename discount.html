<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free discount calculator. Calculate sale price and money saved.">
  <title>Discount Calculator | Free Calculators</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container calculator-page">
    <a class="back" href="../index.html">← All calculators</a>
    <section class="calculator">
      <h1>Discount Calculator</h1>
      <p class="intro">Calculate the final price after a discount and see how much you save.</p>
      <div class="field">
        <label for="price">Original price</label>
        <input id="price" type="number" step="any" placeholder="e.g. 100">
      </div>
      <div class="field">
        <label for="discount">Discount (%)</label>
        <input id="discount" type="number" step="any" placeholder="e.g. 20">
      </div>
      <button onclick="calculate()">Calculate</button>
      <div class="result" id="result"></div>
      <div class="explanation">
        <h2>How it works</h2>
        <p>Enter the original price and discount percentage. The calculator shows both the amount saved and the final price.</p>
      </div>
    </section>
  </main>
  <script>
    function calculate() {
      const price = parseFloat(document.getElementById('price').value);
      const discount = parseFloat(document.getElementById('discount').value);
      const result = document.getElementById('result');
      if (isNaN(price) || isNaN(discount)) {
        result.textContent = 'Please enter both values.';
        return;
      }
      const saved = price * discount / 100;
      const finalPrice = price - saved;
      result.innerHTML = `You save <strong>${format(saved)}</strong>. Final price: <strong>${format(finalPrice)}</strong>.`;
    }
    function format(n) {
      return Number.isInteger(n) ? n : Number(n.toFixed(2));
    }
  </script>
</body>
</html>
