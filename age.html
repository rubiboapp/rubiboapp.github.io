<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free age calculator. Calculate your exact age in years, months and days.">
  <title>Age Calculator | Free Calculators</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container calculator-page">
    <a class="back" href="../index.html">← All calculators</a>
    <section class="calculator">
      <h1>Age Calculator</h1>
      <p class="intro">Calculate your age in years, months and days.</p>
      <div class="field">
        <label for="birth">Date of birth</label>
        <input id="birth" type="date">
      </div>
      <button onclick="calculate()">Calculate Age</button>
      <div class="result" id="result"></div>
      <div class="explanation">
        <h2>How it works</h2>
        <p>Choose your date of birth and the calculator compares it with today's date.</p>
      </div>
    </section>
  </main>
  <script>
    function calculate() {
      const value = document.getElementById('birth').value;
      const result = document.getElementById('result');
      if (!value) {
        result.textContent = 'Please select your date of birth.';
        return;
      }

      const birth = new Date(value + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (birth > today) {
        result.textContent = 'Date of birth cannot be in the future.';
        return;
      }

      let years = today.getFullYear() - birth.getFullYear();
      let months = today.getMonth() - birth.getMonth();
      let days = today.getDate() - birth.getDate();

      if (days < 0) {
        months--;
        const previousMonthDays = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        days += previousMonthDays;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      result.textContent = `You are ${years} years, ${months} months and ${days} days old.`;
    }
  </script>
</body>
</html>
